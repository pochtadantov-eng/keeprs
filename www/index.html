<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Кошелёк</title>
<meta name="theme-color" content="#10161F">
<meta name="description" content="Крипто-кошелёк на TON">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кошелёк">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
/* Mulish (SIL OFL) — локально, чтобы работало офлайн в .ipa */
@font-face{font-family:"Mulish";font-weight:400;font-display:swap;src:url(fonts/mulish-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Mulish";font-weight:400;font-display:swap;src:url(fonts/mulish-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Mulish";font-weight:500;font-display:swap;src:url(fonts/mulish-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Mulish";font-weight:500;font-display:swap;src:url(fonts/mulish-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Mulish";font-weight:600;font-display:swap;src:url(fonts/mulish-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Mulish";font-weight:600;font-display:swap;src:url(fonts/mulish-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Mulish";font-weight:700;font-display:swap;src:url(fonts/mulish-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Mulish";font-weight:700;font-display:swap;src:url(fonts/mulish-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root {
  --bg: #10161F;
  --surface: #1D2633;
  --surface-2: #2E3847;
  --surface-3: #424C5C;
  --pill: #293342;
  --fg: #FFFFFF;
  --fg-dim: #8994A3;
  --fg-faint: #556170;
  --accent: #3C95FA;
  --green: #39CC83;
  --green-bg: #214040;
  --divider: #252F3D;
  --tabbar-bg: rgba(16, 22, 31, 0.94);
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html, body { margin: 0; min-height: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Mulish", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 20;
  pointer-events: none;
}

button { font-family: inherit; font-weight: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }

.screen {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px));
}

/* ===== Top bar ===== */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding-block: 4px 2px;
}
.topbar .left { justify-self: start; margin-left: -4px; }
.topbar .right { justify-self: end; display: flex; margin-right: -4px; }

.icon-btn {
  width: 40px; height: 40px;
  border: none;
  background: transparent;
  color: var(--fg-dim);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 28px; height: 28px; }

.wallet-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--pill);
  color: var(--fg);
  border: none;
  border-radius: 999px;
  padding: 8px 13px 8px 11px;
  font-size: 14px;
  line-height: 24px;
  font-weight: 600;
}
.wallet-pill .rub { width: 17px; height: 17px; }
.wallet-pill .chev { width: 17px; height: 17px; color: #B2B5BB; margin: 0 -2px 0 1px; }

/* ===== Balance hero ===== */
.hero {
  text-align: center;
  padding: 43px 0 0;
}
.balance-row {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
}
.balance {
  font-weight: 700;
  font-size: 43.5px;
  letter-spacing: -0.01em;
  line-height: 1;
  color: var(--fg);
  margin: 0;
  white-space: nowrap;
}
.balance .cents { font-size: .73em; letter-spacing: 0; }
.bolt {
  position: relative;
  width: 19px;
  height: 32px;
  box-sizing: border-box;
  border-radius: 6px;
  background: transparent;
  border: 2px solid #38424F;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex: none;
}
.bolt::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -5.5px;
  width: 9px;
  height: 3px;
  margin-left: -4.5px;
  border-radius: 2px 2px 0 0;
  background: #38424F;
}
.bolt svg { width: 11px; height: 15px; }

.address-row {
  margin-top: 7px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  color: var(--fg-dim);
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  padding: 4px 8px;
  border-radius: 999px;
  transition: background .15s;
}
.address-row:active { background: var(--surface); }
.badge-chain {
  background: #16332F;
  color: var(--green);
  font-size: 11px;
  line-height: 15px;
  font-weight: 700;
  padding: 3px 4.5px;
  border-radius: 6px;
  position: relative;
  top: -1px;
}

/* ===== Action row ===== */
.actions {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 9px;
  width: max-content;
  margin: 0 auto;
  padding: 27px 0 8px;
}
.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  background: transparent;
  border: none;
  color: var(--fg);
  padding: 0;
}
.action .ring {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .1s, background .15s;
}
.action:active .ring { transform: scale(.94); background: var(--surface-2); }
.action .ring svg { width: 26px; height: 26px; color: var(--fg); stroke-width: 2.3; }
.action .label {
  font-size: 12px;
  line-height: 16px;
  color: var(--fg-dim);
  font-weight: 600;
  white-space: nowrap;
}

/* ===== Section headers ===== */
.section { margin-top: 25px; }
.section + .section { margin-top: 28px; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.section-head .title {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  padding: 0;
  color: var(--fg);
}
.section-head h2 {
  margin: 0;
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
}
.section-head .title .chev { color: var(--fg-dim); width: 14px; height: 14px; }
.section-head .manage {
  background: transparent;
  border: none;
  color: var(--fg-dim);
  font-size: 13.5px;
  line-height: 24px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
}
.section-head .manage svg { width: 20px; height: 20px; margin-right: -4px; }

/* ===== Crypto list card ===== */
.card {
  background: var(--surface);
  border-radius: 20px;
  overflow: hidden;
}
.row {
  position: relative;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background: transparent;
  border: none;
  width: 100%;
  color: var(--fg);
  text-align: left;
}
.row + .row::before {
  content: "";
  position: absolute;
  left: 16px; right: 0; top: 0;
  height: .34px;
  background: var(--divider);
}
.row:active { background: var(--surface-2); }

.token {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex: none;
}
.token.gram { background: #30A1F5; }
.token.usdt { background: #009393; }
.token svg.gem { width: 30px; height: 20px; }
.token .chain-sub {
  position: absolute;
  right: -6px; bottom: -6px;
  width: 25px; height: 25px;
  box-sizing: border-box;
  border-radius: 50%;
  background: #0098EA;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--surface);
}
.token .chain-sub svg { width: 11px; height: 11px; }

.info { min-width: 0; }
.info .line1 {
  display: flex;
  align-items: center;
  gap: 6px;
}
.info .line1 .name {
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
}
.badge-apy, .badge-chain-pill {
  font-size: 9.5px;
  line-height: 16px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 8px;
  white-space: nowrap;
}
.badge-apy { background: var(--green-bg); color: var(--green); }
.badge-chain-pill { background: var(--surface-2); color: var(--fg-dim); }
.pin { color: var(--fg-faint); display: inline-flex; margin-left: 1px; }
.pin svg { width: 14px; height: 14px; transform: rotate(45deg); }

.info .line2 {
  font-size: 13px;
  line-height: 20px;
  font-weight: 500;
  color: var(--fg-dim);
  display: inline-flex;
  gap: 6px;
  letter-spacing: -.04em;
}
.info .line2 .delta { color: var(--green); }
.info .line2 .delta.neg { color: #FF4766; }

.amount { text-align: right; }
.amount .big {
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
  letter-spacing: .065em;
  color: var(--fg);
}
.amount .small {
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  color: var(--fg-dim);
}

/* ===== Collections ===== */
.nft-row {
  display: flex;
  gap: 10px;
  padding-top: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.nft-row::-webkit-scrollbar { display: none; }
.nft {
  flex: none;
  width: 114px;
  background: var(--surface);
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: none;
  padding: 0;
  color: inherit;
  text-align: left;
}
.nft:active { background: var(--surface-2); }
.nft-art {
  aspect-ratio: 1 / 1;
  background: linear-gradient(180deg, #263B46 0%, #1E2F39 100%);
  position: relative;
}
.nft-art .tg {
  position: absolute;
  left: 50%; top: 16px;
  width: 43px; height: 43px;
  margin-left: -21.5px;
}
.nft-handle {
  position: absolute;
  left: 0; right: 0; bottom: 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.nft-handle .chip {
  background: #C49A3F;
  color: #fff;
  font-weight: 800;
  font-size: 12.5px;
  line-height: 16px;
  padding: 3px 8px;
  border-radius: 7px;
}
.nft-handle .url {
  font-size: 8px;
  line-height: 12px;
  font-weight: 600;
  color: #83929D;
  transform: scaleX(.72);
}
.nft-label { padding: 8px 6px 5px 12px; }
.nft-label .n1 { font-size: 13.5px; line-height: 20px; font-weight: 600; color: var(--fg); }
.nft-label .n2 { font-size: 12.5px; line-height: 18px; font-weight: 500; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Bottom tab bar ===== */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(0px, calc(env(safe-area-inset-bottom, 0px) - 10px));
  padding-top: 8px;
  background: var(--tabbar-bg);
  backdrop-filter: saturate(160%) blur(18px);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  z-index: 15;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.tab {
  --c1: var(--fg-dim);
  --c2: #373E49;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: none;
  color: var(--fg-dim);
  padding: 4px 4px;
}
.tab svg { width: 25px; height: 25px; margin: -.5px 0; }
.tab .tab-label { font-size: 12px; line-height: 16px; font-weight: 600; }
.tab.active { --c1: var(--accent); --c2: #1E3F65; color: var(--accent); }

/* ===== Toast ===== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-3);
  color: var(--fg);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Sheet (for action placeholder) ===== */
.scrim {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  z-index: 31;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.3,.9,.3,1);
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 32px rgba(0,0,0,.5);
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--surface-3);
  border-radius: 2px;
  margin: 0 auto 12px;
}
.sheet h3 { margin: 10px 0 6px; font-size: 20px; font-weight: 700; }
.sheet p { margin: 0 0 18px; color: var(--fg-dim); font-size: 14px; line-height: 1.5; }
.sheet .cta {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
}

/* ===== Panels per tab ===== */
.panel { display: none; }
.panel.active { display: block; }
.panel-placeholder {
  text-align: center;
  padding: 120px 20px;
  color: var(--fg-dim);
}
.panel-placeholder .big {
  font-size: 48px;
  margin-bottom: 10px;
  opacity: .5;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="screen">
  <header class="topbar">
    <div class="left">
      <button class="icon-btn" aria-label="Сканировать">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path transform="translate(12 12) scale(.92) translate(-12 -12)" stroke-width="1.85" d="M3.5 9V6.5a3 3 0 0 1 3-3H9M15 3.5h2.5a3 3 0 0 1 3 3V9M20.5 15v2.5a3 3 0 0 1-3 3H15M9 20.5H6.5a3 3 0 0 1-3-3V15M7.5 12h9"/>
        </svg>
      </button>
    </div>
    <button class="wallet-pill" id="wallet-pill">
      <svg class="rub" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="12" fill="#fff"/>
        <path d="M9.2 17.8V6.2h3.4a2.9 2.9 0 0 1 0 5.8H9.2M7.4 14.4h6.2" fill="none" stroke="#293342" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Кошелёк</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
    </button>
    <div class="right">
      <button class="icon-btn" aria-label="История">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7.5v5l2 1.5"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" transform="translate(12 12) scale(.8) translate(-12 -12)" stroke-width="2.1"/>
          <path transform="translate(12 12) scale(.8) translate(-12 -12)" stroke-width="2.1" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- WALLET PANEL -->
  <div class="panel active" id="panel-wallet">
    <section class="hero">
      <div class="balance-row">
        <h1 class="balance" id="balance">&lt;&nbsp;$&thinsp;0<span class="cents">,01</span></h1>
        <button class="bolt" aria-label="Быстрое действие">
          <svg viewBox="0 0 10 14" fill="currentColor"><path d="M6.2 0 0 8h4l-.8 6L10 5.6H6z"/></svg>
        </button>
      </div>
      <div>
        <button class="address-row" id="address-row" aria-label="Скопировать адрес">
          <span id="address-text">UQBQ...<span style="opacity:.6">_</span>nR4</span>
          <span class="badge-chain">W5</span>
        </button>
      </div>
    </section>

    <section class="actions">

<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <h3 id="sheet-title">—</h3>
  <p id="sheet-body">—</p>
  <button class="cta" id="sheet-cta">Понятно</button>
</section>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);

// Tab switching
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const name = btn.dataset.tab;
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    const panel = document.getElementById("panel-" + name);
    if (panel) panel.classList.add("active");
    window.scrollTo({ top: 0, behavior: "instant" });
  });
});

// Copy address
$("#address-row").addEventListener("click", async () => {
  const full = "UQBQ4bN3kR8vP2tL9mXjH7cDqY1aZ6fS0wE3nR4";
  try {
    await navigator.clipboard.writeText(full);
    toast("Адрес скопирован");
  } catch (_) {
    const t = document.createElement("textarea");
    t.value = full; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Адрес скопирован"); } catch (__) {}
    document.body.removeChild(t);
  }
});

// Balance toggle (demo: $ ↔ ₽)
let altBalance = false;
$("#balance").addEventListener("click", () => {
  altBalance = !altBalance;
  $("#balance").innerHTML = altBalance
    ? "&lt;&nbsp;₽&thinsp;1"
    : "&lt;&nbsp;$&thinsp;0<span class=\"cents\">,01</span>";
});

// Actions open explanatory sheet
const sheetDefs = {
  send:    { t: "Отправить", b: "Отправка криптовалюты на любой адрес сети. Введите адрес получателя, выберите токен и сумму." },
  receive: { t: "Пополнить", b: "Покажите QR-код своего адреса или скопируйте его, чтобы получить перевод." },
  swap:    { t: "Обменять", b: "Моментальный обмен между токенами в сети TON по лучшей ставке." },
  stake:   { t: "Застейкать", b: "Разместите TON в стейкинге и получайте пассивный доход ~5–6 % годовых." },
};
document.querySelectorAll(".action").forEach(btn => {
  btn.addEventListener("click", () => {
    const def = sheetDefs[btn.dataset.action];
    if (!def) return;
    $("#sheet-title").textContent = def.t;
    $("#sheet-body").textContent = def.b;
    openSheet();
  });
});
$("#wallet-pill").addEventListener("click", () => {
  $("#sheet-title").textContent = "Кошельки";
  $("#sheet-body").textContent = "Переключение между кошельками: основной, резервный, тестовая сеть.";
  openSheet();
});
$("#sheet-cta").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);

function openSheet() {
  $("#sheet").classList.add("open");
  $("#scrim").classList.add("open");
  $("#sheet").setAttribute("aria-hidden","false");
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#scrim").classList.remove("open");
  $("#sheet").setAttribute("aria-hidden","true");
}

// Toast
let toastT = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 2200);
}

// ESC closes sheet
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Register service worker (offline + installable PWA)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
