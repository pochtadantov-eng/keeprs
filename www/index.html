<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Кошелёк</title>
<meta name="theme-color" content="#10161F">
<meta name="description" content="Крипто-кошелёк на TON">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кошелёк">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
/* Onest (SIL OFL) — локально, чтобы работало офлайн в .ipa */
@font-face{font-family:"Onest";font-weight:100 900;font-display:swap;src:url(fonts/onest-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:100 900;font-display:swap;src:url(fonts/onest-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root {
  --bg: #10161F;
  --surface: #1D2633;
  --surface-2: #2E3847;
  --surface-3: #424C5C;
  --pill: #293342;
  --fg: #FFFFFF;
  --fg-dim: #8994A3;
  --fg-faint: #556170;
  --accent: #3C95FA;
  --green: #39CC83;
  --green-bg: #214040;
  --divider: #252F3D;
  --tabbar-bg: rgba(16, 22, 31, 0.94);
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html, body { margin: 0; min-height: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Onest", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 20;
  pointer-events: none;
}

button { font-family: inherit; font-weight: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }

.screen {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px));
}

/* ===== Top bar ===== */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding-block: 4px 2px;
}
.topbar .left { justify-self: start; margin-left: -4px; }
.topbar .right { justify-self: end; display: flex; margin-right: -4px; }

.icon-btn {
  width: 40px; height: 40px;
  border: none;
  background: transparent;
  color: var(--fg-dim);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { flex: none; }

.wallet-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--pill);
  color: var(--fg);
  border: none;
  border-radius: 999px;
  padding: 8px 13px 8px 11px;
  font-size: 14px;
  line-height: 24px;
  font-weight: 600;
}
.wallet-pill .rub { width: 17px; height: 17px; }
.wallet-pill .chev { width: 17px; height: 17px; color: #B2B5BB; margin: 0 -2px 0 1px; }

/* ===== Balance hero ===== */
.hero {
  text-align: center;
  padding: 44.5px 0 0;
}
.balance-row {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
}
.balance {
  font-weight: 600;
  font-size: 43.5px;
  letter-spacing: 0.008em;
  line-height: 1;
  color: var(--fg);
  margin: 0;
  white-space: nowrap;
}
.balance .cents { font-size: .73em; letter-spacing: 0; }
.bolt {
  background: transparent;
  border: none;
  padding: 0;
  display: inline-flex;
  flex: none;
  margin-top: 2px;
}

.address-row {
  margin-top: 5.5px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  color: var(--fg-dim);
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  padding: 4px 8px;
  border-radius: 999px;
  transition: background .15s;
}
.address-row:active { background: var(--surface); }
.badge-chain {
  background: #16332F;
  color: var(--green);
  font-size: 11px;
  line-height: 15px;
  font-weight: 700;
  padding: 3px 4.5px;
  border-radius: 6px;
  position: relative;
  top: -1px;
}

/* ===== Action row ===== */
.actions {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 9px;
  width: max-content;
  margin: 0 auto;
  padding: 27px 0 8px;
}
.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  background: transparent;
  border: none;
  color: var(--fg);
  padding: 0;
}
.action .ring {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .1s, background .15s;
}
.action:active .ring { transform: scale(.94); background: var(--surface-2); }
.action .ring svg { color: var(--fg); }
.action .label {
  font-size: 12px;
  line-height: 16px;
  color: var(--fg-dim);
  font-weight: 600;
  white-space: nowrap;
}

/* ===== Section headers ===== */
.section { margin-top: 26px; }
.section + .section { margin-top: 28px; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.section-head .title {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  padding: 0;
  color: var(--fg);
}
.section-head h2 {
  margin: 0;
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
}
.section-head .title .chev { color: var(--fg-dim); width: 14px; height: 14px; }
.section-head .manage {
  background: transparent;
  border: none;
  color: var(--fg-dim);
  font-size: 13.5px;
  line-height: 24px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
}
.section-head .manage svg { width: 20px; height: 20px; margin-right: -4px; }

/* ===== Crypto list card ===== */
.card {
  background: var(--surface);
  border-radius: 20px;
  overflow: hidden;
}
.row {
  position: relative;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background: transparent;
  border: none;
  width: 100%;
  color: var(--fg);
  text-align: left;
}
.row + .row::before {
  content: "";
  position: absolute;
  left: 16px; right: 0; top: 0;
  height: .34px;
  background: var(--divider);
}
.row:active { background: var(--surface-2); }

.token {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex: none;
}
.token.gram { background: #30A1F5; }
.token.usdt { background: #009393; }
.token svg.gem { width: 30px; height: 20px; }
.token .chain-sub {
  position: absolute;
  right: -6px; bottom: -6px;
  width: 25px; height: 25px;
  box-sizing: border-box;
  border-radius: 50%;
  background: #0098EA;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--surface);
}
.token .chain-sub svg { width: 11px; height: 11px; }

.info { min-width: 0; }
.info .line1 {
  display: flex;
  align-items: center;
  gap: 6px;
}
.info .line1 .name {
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
}
.badge-apy, .badge-chain-pill {
  font-size: 9.5px;
  line-height: 16px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 8px;
  white-space: nowrap;
}
.badge-apy { background: var(--green-bg); color: var(--green); }
.badge-chain-pill { background: var(--surface-2); color: var(--fg-dim); }
.pin { color: var(--fg-faint); display: inline-flex; margin-left: 1px; }
.pin svg { width: 14px; height: 14px; transform: rotate(45deg); }

.info .line2 {
  font-size: 13px;
  line-height: 20px;
  font-weight: 500;
  color: var(--fg-dim);
  display: inline-flex;
  gap: 6px;
}
.info .line2 .delta { color: var(--green); }
.info .line2 .delta.neg { color: #FF4766; }

.amount { text-align: right; }
.amount .big {
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
  letter-spacing: .045em;
  color: var(--fg);
}
.amount .small {
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  color: var(--fg-dim);
}

/* ===== Collections ===== */
.nft-row {
  display: flex;
  gap: 10px;
  padding-top: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.nft-row::-webkit-scrollbar { display: none; }
.nft {
  flex: none;
  width: 114px;
  background: var(--surface);
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: none;
  padding: 0;
  color: inherit;
  text-align: left;
}
.nft:active { background: var(--surface-2); }
.nft-art {
  aspect-ratio: 1 / 1;
  background: linear-gradient(180deg, #263B46 0%, #1E2F39 100%);
  position: relative;
}
.nft-art .tg {
  position: absolute;
  left: 50%; top: 16px;
  width: 43px; height: 43px;
  margin-left: -21.5px;
}
.nft-handle {
  position: absolute;
  left: 0; right: 0; bottom: 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.nft-handle .chip {
  background: #C49A3F;
  color: #fff;
  font-weight: 800;
  font-size: 12.5px;
  line-height: 16px;
  padding: 3px 8px;
  border-radius: 7px;
}
.nft-handle .url {
  font-size: 8px;
  line-height: 12px;
  font-weight: 600;
  color: #83929D;
  transform: scaleX(.72);
}
.nft-label { padding: 8px 6px 5px 12px; }
.nft-label .n1 { font-size: 13.5px; line-height: 20px; font-weight: 600; color: var(--fg); }
.nft-label .n2 { font-size: 12.5px; line-height: 18px; font-weight: 500; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Bottom tab bar ===== */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(0px, calc(env(safe-area-inset-bottom, 0px) - 10px));
  padding-top: 8px;
  background: var(--tabbar-bg);
  backdrop-filter: saturate(160%) blur(18px);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  z-index: 15;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.tab {
  --c1: var(--fg-dim);
  --c2: #373E49;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: transparent;
  border: none;
  color: var(--fg-dim);
  padding: 4px 4px;
}
.tab svg { flex: none; }
.tab .tab-label { font-size: 12px; line-height: 16px; font-weight: 600; }
.tab.active { --c1: var(--accent); --c2: #1E3F65; color: var(--accent); }

/* ===== Toast ===== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-3);
  color: var(--fg);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Sheet (for action placeholder) ===== */
.scrim {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  z-index: 31;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.3,.9,.3,1);
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 32px rgba(0,0,0,.5);
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--surface-3);
  border-radius: 2px;
  margin: 0 auto 12px;
}
.sheet h3 { margin: 10px 0 6px; font-size: 20px; font-weight: 700; }
.sheet p { margin: 0 0 18px; color: var(--fg-dim); font-size: 14px; line-height: 1.5; }
.sheet .cta {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
}

/* ===== Panels per tab ===== */
.panel { display: none; }
.panel.active { display: block; }
.panel-placeholder {
  text-align: center;
  padding: 120px 20px;
  color: var(--fg-dim);
}
.panel-placeholder .big {
  font-size: 48px;
  margin-bottom: 10px;
  opacity: .5;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="screen">
  <header class="topbar">
    <div class="left">
      <button class="icon-btn" aria-label="Сканировать">
        <svg viewBox="0 0 64 64" width="21.33" height="21.33" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M12.1 61.8C8.6 61.0 6.4 59.6 4.4 57.0C2.6 54.6 2.2 53.2 2.1 47.7L2.0 43.0L2.9 42.0C4.4 40.6 5.6 40.6 7.0 42.0L8.0 42.9L8.0 47.0C8.0 52.5 8.7 54.0 11.6 55.4C12.8 56.0 13.2 56.0 17.0 56.0L21.1 56.0L22.0 57.0C22.9 57.8 23.0 58.1 23.0 59.0C23.0 59.9 22.9 60.2 22.0 61.0L21.1 62.0L16.8 62.0C14.5 62.0 12.4 61.9 12.1 61.8ZM42.0 61.1C40.6 59.6 40.6 58.4 42.0 57.0L42.9 56.0L47.0 56.0C50.8 56.0 51.2 56.0 52.4 55.4C55.3 54.0 56.0 52.5 56.0 47.0L56.0 42.9L57.0 42.0C58.4 40.6 59.6 40.6 61.1 42.0L62.0 43.0L61.9 47.7C61.8 54.4 60.8 56.7 57.0 59.6C54.6 61.4 53.2 61.8 47.7 61.9L43.0 62.0L42.0 61.1ZM15.0 34.0C14.1 33.2 14.0 32.9 14.0 32.0C14.0 31.1 14.1 30.8 15.0 30.0L15.9 29.0L32.0 29.0L48.1 29.0L49.0 30.0C50.4 31.4 50.4 32.6 49.0 34.0L48.1 35.0L32.0 35.0L15.9 35.0L15.0 34.0ZM2.9 22.0L2.0 21.0L2.1 16.3C2.2 10.8 2.6 9.4 4.4 7.0C7.3 3.2 9.6 2.2 16.3 2.1L21.0 2.0L22.0 2.9C23.4 4.4 23.4 5.6 22.0 7.0L21.1 8.0L17.0 8.0C13.2 8.0 12.8 8.0 11.6 8.6C8.7 10.0 8.0 11.5 8.0 17.0L8.0 21.1L7.0 22.0C5.6 23.4 4.4 23.4 2.9 22.0ZM57.0 22.0L56.0 21.1L56.0 17.0C56.0 11.5 55.3 10.0 52.4 8.6C51.2 8.0 50.8 8.0 47.0 8.0L42.9 8.0L42.0 7.0C40.6 5.6 40.6 4.4 42.0 2.9L43.0 2.0L47.7 2.1C53.2 2.2 54.6 2.6 57.0 4.4C60.8 7.3 61.8 9.6 61.9 16.3L62.0 21.0L61.1 22.0C59.6 23.4 58.4 23.4 57.0 22.0Z"/></svg>
      </button>
    </div>
    <button class="wallet-pill" id="wallet-pill">
      <svg class="rub" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="12" fill="#fff"/>
        <path d="M9.2 17.8V6.2h3.4a2.9 2.9 0 0 1 0 5.8H9.2M7.4 14.4h6.2" fill="none" stroke="#293342" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Кошелёк</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
    </button>

<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <h3 id="sheet-title">—</h3>
  <p id="sheet-body">—</p>
  <button class="cta" id="sheet-cta">Понятно</button>
</section>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);

// Tab switching
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const name = btn.dataset.tab;
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    const panel = document.getElementById("panel-" + name);
    if (panel) panel.classList.add("active");
    window.scrollTo({ top: 0, behavior: "instant" });
  });
});

// Copy address
$("#address-row").addEventListener("click", async () => {
  const full = "UQBQ4bN3kR8vP2tL9mXjH7cDqY1aZ6fS0wE3nR4";
  try {
    await navigator.clipboard.writeText(full);
    toast("Адрес скопирован");
  } catch (_) {
    const t = document.createElement("textarea");
    t.value = full; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Адрес скопирован"); } catch (__) {}
    document.body.removeChild(t);
  }
});

// Balance toggle (demo: $ ↔ ₽)
let altBalance = false;
$("#balance").addEventListener("click", () => {
  altBalance = !altBalance;
  $("#balance").innerHTML = altBalance
    ? "&lt;&nbsp;₽&thinsp;1"
    : "&lt;&nbsp;$&thinsp;0<span class=\"cents\">,01</span>";
});

// Actions open explanatory sheet
const sheetDefs = {
  send:    { t: "Отправить", b: "Отправка криптовалюты на любой адрес сети. Введите адрес получателя, выберите токен и сумму." },
  receive: { t: "Пополнить", b: "Покажите QR-код своего адреса или скопируйте его, чтобы получить перевод." },
  swap:    { t: "Обменять", b: "Моментальный обмен между токенами в сети TON по лучшей ставке." },
  stake:   { t: "Застейкать", b: "Разместите TON в стейкинге и получайте пассивный доход ~5–6 % годовых." },
};
document.querySelectorAll(".action").forEach(btn => {
  btn.addEventListener("click", () => {
    const def = sheetDefs[btn.dataset.action];
    if (!def) return;
    $("#sheet-title").textContent = def.t;
    $("#sheet-body").textContent = def.b;
    openSheet();
  });
});
$("#wallet-pill").addEventListener("click", () => {
  $("#sheet-title").textContent = "Кошельки";
  $("#sheet-body").textContent = "Переключение между кошельками: основной, резервный, тестовая сеть.";
  openSheet();
});
$("#sheet-cta").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);

function openSheet() {
  $("#sheet").classList.add("open");
  $("#scrim").classList.add("open");
  $("#sheet").setAttribute("aria-hidden","false");
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#scrim").classList.remove("open");
  $("#sheet").setAttribute("aria-hidden","true");
}

// Toast
let toastT = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 2200);
}

// ESC closes sheet
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Register service worker (offline + installable PWA)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
