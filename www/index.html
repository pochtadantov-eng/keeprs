<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Кошелёк</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Крипто-кошелёк на TON">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кошелёк">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: single-column dark crypto wallet. Top row — scan on left, wallet switcher pill in center, clock + gear on right. Centered balance hero with a small bolt bubble. Pill with address + chain badge. Row of four round quick actions. Section headers (Крипто, Коллекции) each with a rounded dark card below. Fixed bottom tab bar on top of a blur. Deliberately dark-only, like Telegram Wallet. */

:root {
  /* Tonkeeper theme (Apache-2.0, github.com/tonkeeper/tonkeeper-web) */
  --bg: #10161F;             /* backgroundPage */
  --surface: #1D2633;         /* backgroundContent */
  --surface-2: #2E3847;       /* backgroundContentTint */
  --surface-3: #424C5C;       /* backgroundContentAttention */
  --fg: #EBEBEB;              /* textPrimary */
  --fg-dim: #8994A3;          /* textSecondary */
  --fg-faint: #556170;        /* textTertiary */
  --accent: #45AEF5;          /* accentBlue */
  --green: #39CC83;           /* accentGreen */
  --green-bg: rgba(57, 204, 131, 0.15);
  --red: #FF4766;             /* accentRed */
  --divider: rgba(79, 90, 112, 0.24);
  --tabbar-bg: rgba(16, 22, 31, 0.92);
  color-scheme: dark;
}

html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 20;
  pointer-events: none;
}

button { font-family: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.screen {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px));
}

/* ===== Top bar ===== */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding-block: 4px 2px;
}
.topbar .left { justify-self: start; }
.topbar .right { justify-self: end; display: flex; gap: 2px; }

.icon-btn {
  width: 40px; height: 40px;
  border: none;
  background: transparent;
  color: var(--fg);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 24px; height: 24px; }

.wallet-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  color: var(--fg);
  border: none;
  border-radius: 999px;
  padding: 9px 14px 9px 10px;
  font-size: 15px;
  font-weight: 500;
}
.wallet-pill .rub {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface-2);
  font-size: 13px;
  font-weight: 600;
  color: var(--fg);
}
.wallet-pill .chev { width: 14px; height: 14px; opacity: .9; }

/* ===== Balance hero ===== */
.hero {
  text-align: center;
  padding: 36px 0 6px;
}
.balance-row {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
}
.balance {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  font-weight: 700;
  font-size: 58px;
  letter-spacing: -0.025em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
  margin: 0;
}
.balance .cents {
  font-size: 0.5em;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.bolt {
  position: relative;
  width: 46px;
  height: 24px;
  border-radius: 6px;
  background: var(--surface-2);
  border: none;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}
.bolt::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 11px;
  background: var(--surface-2);
  border-radius: 0 2px 2px 0;
}
.bolt svg { width: 12px; height: 12px; }

.address-row {
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  color: var(--fg-dim);
  font-size: 15px;
  font-weight: 500;
  padding: 4px 8px;
  border-radius: 999px;
  transition: background .15s;
}
.address-row:active { background: var(--surface); }
.badge-chain {
  background: var(--green-bg);
  color: var(--green);
  font-size: 12px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  letter-spacing: .02em;
}

/* ===== Action row ===== */
.actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 28px 0 10px;
}
.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  color: var(--fg);
  padding: 4px;
}
.action .ring {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .1s, background .15s;
}
.action:active .ring { transform: scale(.94); background: var(--surface-2); }
.action .ring svg { width: 18px; height: 18px; color: var(--fg); stroke-width: 1.8; }
.action .label {
  font-size: 12px;
  line-height: 16px;
  color: var(--fg-dim);
  font-weight: 500;
}

/* ===== Section headers ===== */
.section {
  margin-top: 26px;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 0 2px;
}
.section-head h2 {
  margin: 0;
  font-size: 20px;
  line-height: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--fg);
  background: transparent;
  border: none;
}
.section-head h2 .chev { color: var(--fg-dim); width: 16px; height: 16px; }
.section-head .manage {
  background: transparent;
  border: none;
  color: var(--fg-dim);
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 2px;
}
.section-head .manage svg { width: 18px; height: 18px; }

/* ===== Crypto list card ===== */
.card {
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
}
.row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 14px;
  background: transparent;
  border: none;
  width: 100%;
  color: var(--fg);
  text-align: left;
}
.row + .row { border-top: 1px solid var(--divider); }
.row:active { background: var(--surface-2); }

.token {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex: none;
}
.token.gram { background: #2ea6ff; color: #ffffff; }
.token.gram svg { width: 22px; height: 22px; }
.token.usdt { background: #26a17b; color: #ffffff; font-weight: 700; font-size: 20px; font-family: Georgia, serif; }
.token.usdt .chain-sub {
  position: absolute;
  right: -2px; bottom: -2px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--surface);
}
.token.usdt .chain-sub svg { width: 10px; height: 10px; }

.info { min-width: 0; }
.info .line1 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
  flex-wrap: wrap;
}
.info .line1 .name {
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
  letter-spacing: -0.005em;
}
.badge-apy {
  background: var(--green-bg);
  color: var(--green);
  font-size: 10px;
  line-height: 14px;
  font-weight: 600;
  padding: 3px 4px;
  border-radius: 4px;
  letter-spacing: .02em;
  white-space: nowrap;
}
.badge-chain-pill {
  background: var(--surface-3);
  color: var(--fg-dim);
  font-size: 10px;
  line-height: 14px;
  font-weight: 600;
  padding: 3px 4px;
  border-radius: 4px;
  letter-spacing: .02em;
}
.pin {
  color: var(--fg-dim);
  display: inline-flex;
  opacity: .7;
}
.pin svg { width: 12px; height: 12px; transform: rotate(45deg); }

.info .line2 {
  font-size: 14px;
  color: var(--fg-dim);
  display: inline-flex;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}
.info .line2 .delta { color: var(--green); font-weight: 500; opacity: .64; }
.info .line2 .delta.neg { color: var(--red); }

.amount {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.amount .big {
  font-size: 17px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.005em;
}
.amount .small {
  font-size: 14px;
  color: var(--fg-dim);
  margin-top: 2px;
}

/* ===== Collections ===== */
.nft-row {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  margin: 0 -2px;
  scrollbar-width: none;
}
.nft-row::-webkit-scrollbar { display: none; }
.nft {
  flex: none;
  width: 182px;
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: none;
  padding: 0;
  color: inherit;
  text-align: left;
}
.nft:active { background: var(--surface-2); }
.nft-art {
  aspect-ratio: 1 / 1;
  background: radial-gradient(120% 100% at 50% 20%, #1b2026 0%, #0f1216 70%);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nft-art .plane {
  width: 56%;
  height: 56%;
  background: #fff;
  border-radius: 24%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 14px rgba(0,0,0,.3);
}
.nft-art .plane svg { width: 70%; height: 70%; color: #2ea6ff; }
.nft-handle {
  position: absolute;
  left: 10px; right: 10px; bottom: 14px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.nft-handle .chip {
  display: inline-block;
  background: #c48b3e;
  color: #1a1104;
  font-weight: 800;
  font-size: 15px;
  padding: 2px 10px;
  border-radius: 7px;
  letter-spacing: -0.01em;
}
.nft-handle .url {
  font-size: 10px;
  color: #c48b3e;
  opacity: .7;
  font-style: italic;
}
.nft-label {
  padding: 10px 12px 12px;
}
.nft-label .n1 { font-size: 15px; font-weight: 600; color: var(--fg); }
.nft-label .n2 { font-size: 13px; color: var(--fg-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Bottom tab bar ===== */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-top: 8px;
  background: var(--tabbar-bg);
  backdrop-filter: saturate(160%) blur(18px);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  border-top: 1px solid var(--divider);
  z-index: 15;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: transparent;
  border: none;
  color: var(--fg-dim);
  padding: 6px 4px 4px;
}
.tab svg { width: 26px; height: 26px; }
.tab .tab-label { font-size: 10px; line-height: 14px; font-weight: 600; }
.tab.active { color: var(--accent); }
.tab.active svg path, .tab.active svg rect, .tab.active svg circle { }

/* ===== Toast ===== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-3);
  color: var(--fg);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Sheet (for action placeholder) ===== */
.scrim {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  z-index: 31;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.3,.9,.3,1);
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 32px rgba(0,0,0,.5);
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--surface-3);
  border-radius: 2px;
  margin: 0 auto 12px;
}
.sheet h3 { margin: 10px 0 6px; font-size: 20px; font-weight: 600; }
.sheet p { margin: 0 0 18px; color: var(--fg-dim); font-size: 14px; line-height: 1.5; }
.sheet .cta {
  width: 100%;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
}

/* ===== Hidden "panels" per tab ===== */
.panel { display: none; }
.panel.active { display: block; }
.panel-placeholder {
  text-align: center;
  padding: 120px 20px;
  color: var(--fg-dim);
}
.panel-placeholder .big {
  font-size: 48px;
  margin-bottom: 10px;
  opacity: .5;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="screen">
  <header class="topbar">
    <div class="left">
      <button class="icon-btn" aria-label="Сканировать">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V6a2 2 0 0 1 2-2h3M20 9V6a2 2 0 0 0-2-2h-3M4 15v3a2 2 0 0 0 2 2h3M20 15v3a2 2 0 0 1-2 2h-3"/>
        </svg>
      </button>
    </div>
    <button class="wallet-pill" id="wallet-pill">
      <span class="rub">₽</span>
      <span>Кошелёк</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="right">
      <button class="icon-btn" aria-label="История">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- WALLET PANEL -->
  <div class="panel active" id="panel-wallet">
    <section class="hero">
      <div class="balance-row">
        <h1 class="balance" id="balance">&lt;&nbsp;$0,<span class="cents">01</span></h1>
        <button class="bolt" aria-label="Быстрое действие">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2 4 14h7l-1 8 9-12h-7z"/>
          </svg>
        </button>
      </div>
      <button class="address-row" id="address-row" aria-label="Скопировать адрес">
        <span id="address-text">UQBQ...<span style="opacity:.6">_</span>nR4</span>
        <span class="badge-chain">W5</span>
      </button>
    </section>

    <section class="actions">
      <button class="action" data-action="send">
        <span class="ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </span>
        <span class="label">Отправить</span>
      </button>
      <button class="action" data-action="receive">
        <span class="ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </span>
        <span class="label">Пополнить</span>
      </button>
      <button class="action" data-action="swap">
        <span class="ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v16M3 7l4-4 4 4M17 21V5M21 17l-4 4-4-4"/></svg>
        </span>
        <span class="label">Обменять</span>
      </button>
      <button class="action" data-action="stake">
        <span class="ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20v-5M10 20v-9M16 20V8"/>
            <path d="M14 6l3-3 3 3M17 3v9"/>
          </svg>
        </span>
        <span class="label">Застейкать</span>
      </button>
    </section>

    <section class="section">
      <div class="section-head">
        <button class="unbtn" style="background:none;border:none;padding:0">
          <h2>Крипто <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></h2>
        </button>
        <button class="manage">
          Управлять
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="6" r="2"/><path d="M3 6h3M10 6h11"/>
            <circle cx="16" cy="12" r="2"/><path d="M3 12h11M18 12h3"/>
            <circle cx="10" cy="18" r="2"/><path d="M3 18h5M12 18h9"/>
          </svg>
        </button>
      </div>
      <div class="card">
        <button class="row" data-token="gram">
          <span class="token gram">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2.5 3 10l9 11.5L21 10z" opacity=".9"/>

    <span class="tab-label">Браузер</span>

<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <h3 id="sheet-title">—</h3>
  <p id="sheet-body">—</p>
  <button class="cta" id="sheet-cta">Понятно</button>
</section>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);

// Tab switching
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const name = btn.dataset.tab;
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    const panel = document.getElementById("panel-" + name);
    if (panel) panel.classList.add("active");
    window.scrollTo({ top: 0, behavior: "instant" });
  });
});

// Copy address
$("#address-row").addEventListener("click", async () => {
  const full = "UQBQ4bN3kR8vP2tL9mXjH7cDqY1aZ6fS0wE3nR4";
  try {
    await navigator.clipboard.writeText(full);
    toast("Адрес скопирован");
  } catch (_) {
    const t = document.createElement("textarea");
    t.value = full; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Адрес скопирован"); } catch (__) {}
    document.body.removeChild(t);
  }
});

// Balance toggle (demo: $ ↔ ₽)
let altBalance = false;
$("#balance").addEventListener("click", () => {
  altBalance = !altBalance;
  $("#balance").innerHTML = altBalance ? "&lt;&nbsp;₽ 1" : "&lt;&nbsp;$0,01";
});

// Actions open explanatory sheet
const sheetDefs = {
  send:    { t: "Отправить", b: "Отправка криптовалюты на любой адрес сети. Введите адрес получателя, выберите токен и сумму." },
  receive: { t: "Пополнить", b: "Покажите QR-код своего адреса или скопируйте его, чтобы получить перевод." },
  swap:    { t: "Обменять", b: "Моментальный обмен между токенами в сети TON по лучшей ставке." },
  stake:   { t: "Застейкать", b: "Разместите TON в стейкинге и получайте пассивный доход ~5–6 % годовых." },
};
document.querySelectorAll(".action").forEach(btn => {
  btn.addEventListener("click", () => {
    const def = sheetDefs[btn.dataset.action];
    if (!def) return;
    $("#sheet-title").textContent = def.t;
    $("#sheet-body").textContent = def.b;
    openSheet();
  });
});
$("#wallet-pill").addEventListener("click", () => {
  $("#sheet-title").textContent = "Кошельки";
  $("#sheet-body").textContent = "Переключение между кошельками: основной, резервный, тестовая сеть.";
  openSheet();
});
$("#sheet-cta").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);

function openSheet() {
  $("#sheet").classList.add("open");
  $("#scrim").classList.add("open");
  $("#sheet").setAttribute("aria-hidden","false");
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#scrim").classList.remove("open");
  $("#sheet").setAttribute("aria-hidden","true");
}

// Toast
let toastT = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 2200);
}

// ESC closes sheet
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Telegram Mini App: сливаем шапку с тёмным фоном, чтобы X и ⋯ не выделялись белым
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  try { tg.ready(); } catch (_) {}
  try { tg.expand(); } catch (_) {}
  try { tg.setHeaderColor("#10161F"); } catch (_) {}
  try { tg.setBackgroundColor("#10161F"); } catch (_) {}
}

// Register service worker (offline + installable PWA)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
