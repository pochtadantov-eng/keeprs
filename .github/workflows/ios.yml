name: Build iOS .ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned .ipa on macOS
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest stable Xcode (new SDK => app uses the full screen)
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          echo "Using ${NEWEST:-default Xcode}"
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm install

      - name: Add iOS Capacitor platform
        run: npx cap add ios

      - name: Generate iOS app icon & splash from assets/
        run: npx capacitor-assets generate --ios

      - name: Capacitor sync (copy web + plugins into ios/)
        run: npx cap sync ios

      - name: Allow 120 Hz (ProMotion) for the whole app, WebView animations included
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" "$PLIST"
          plutil -p "$PLIST" | grep -i "CADisableMinimumFrameDurationOnPhone" || true

      - name: Show launch-screen keys in Info.plist (compat-mode diagnostics)
        run: |
          plutil -p ios/App/App/Info.plist | grep -iE "Launch|Scene|FullScreen|MinimumOS" || true
          ls ios/App/App/Base.lproj || true

      - name: Show Xcode & Pod versions
        run: |
          xcodebuild -version
          pod --version || true
          sw_vers

      - name: Build .app (unsigned, Release)
        run: |
          set -e
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            build

      - name: Repackage .app into unsigned .ipa
        run: |
          set -e
          cd ios/App/build/Build/Products/Release-iphoneos
          ls -la
          mkdir -p Payload
          cp -R App.app Payload/App.app
          zip -qry Koshelek-unsigned.ipa Payload
          ls -lh Koshelek-unsigned.ipa

      - name: Publish .ipa to GitHub Release (plain file, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          IPA=ios/App/build/Build/Products/Release-iphoneos/Koshelek-unsigned.ipa
          TAG=latest-ipa
          gh release delete "$TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" "$IPA" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Сборка #${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "Неподписанный .ipa для Sideloadly / AltStore. Коммит: $GITHUB_SHA"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Koshelek-unsigned.ipa"

      - name: Upload .ipa as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Koshelek-unsigned-ipa
          path: ios/App/build/Build/Products/Release-iphoneos/Koshelek-unsigned.ipa
          retention-days: 14

      - name: Also upload .app bundle (for Sideloadly / resign tools)
        uses: actions/upload-artifact@v4
        with:
          name: Koshelek-app-bundle
          path: ios/App/build/Build/Products/Release-iphoneos/App.app
          retention-days: 14
